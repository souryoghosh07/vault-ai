[package]
name = "vault-ui"
version = "1.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "vault_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
